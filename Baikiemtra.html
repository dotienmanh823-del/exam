<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đề thi trắc nghiệm - Định thức ma trận</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: linear-gradient(145deg, #f5f7fa 0%, #e9edf5 100%);
            margin: 0;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 1000px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #1e2b3c;
            font-weight: 600;
            font-size: 2.2rem;
            margin-top: 0;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        h1 span {
            background: #2c3e50;
            color: #fff;
            font-size: 1rem;
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: 400;
        }
        .subhead {
            text-align: center;
            color: #4a5b6b;
            margin-bottom: 28px;
            font-size: 1.1rem;
            border-bottom: 2px dashed #b0c4de;
            padding-bottom: 16px;
        }
        .score-panel {
            background: #ffffffd9;
            backdrop-filter: blur(4px);
            padding: 16px 24px;
            border-radius: 60px;
            box-shadow: 0 8px 20px rgba(0,20,40,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border: 1px solid #ffffff;
            font-weight: 500;
            color: #1e2b3c;
        }
        .score-panel .score {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e6f3f;
        }
        .reset-btn {
            background: #2c3e50;
            border: none;
            color: white;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .reset-btn:hover {
            background: #1e2b3c;
            transform: scale(1.02);
        }
        .question-card {
            background: white;
            border-radius: 28px;
            padding: 28px 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,20,40,0.08);
            transition: all 0.15s ease;
            border: 1px solid #ffffff;
        }
        .question-card.correct-highlight {
            border-left: 8px solid #2ecc71;
        }
        .question-card.wrong-highlight {
            border-left: 8px solid #e74c3c;
        }
        .q-header {
            display: flex;
            align-items: baseline;
            gap: 14px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .q-num {
            background: #1e2b3c;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            flex-shrink: 0;
        }
        .q-text {
            font-size: 1.22rem;
            font-weight: 500;
            color: #0f1a26;
            line-height: 1.5;
            flex: 1;
        }
        .badge {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            padding: 5px 12px;
            border-radius: 40px;
            background: #eef2f7;
            color: #2c3e50;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .badge.theory { background: #d4e6f1; color: #1a5276; }
        .badge.easy { background: #d5f5e3; color: #1e6f3f; }
        .badge.medium { background: #fdebd0; color: #9c640c; }
        .badge.hard { background: #fadbd8; color: #922b21; }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 20px 0 12px;
        }
        @media (max-width: 650px) {
            .options {
                grid-template-columns: 1fr;
            }
        }
        .option {
            background: #f8fafd;
            border: 2px solid #e2e8f0;
            border-radius: 18px;
            padding: 14px 20px;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #1e2b3c;
            font-weight: 500;
            user-select: none;
        }
        .option:hover:not(.locked) {
            background: #eef2f9;
            border-color: #a0b8d0;
            transform: translateY(-1px);
        }
        .option.correct {
            background: #d4efdf;
            border-color: #2ecc71;
            color: #0e4f2a;
            pointer-events: none;
        }
        .option.wrong {
            background: #fadbd8;
            border-color: #e74c3c;
            color: #7b241c;
            pointer-events: none;
        }
        .option.locked {
            pointer-events: none;
            opacity: 0.9;
        }
        .option .letter {
            font-weight: 700;
            background: #ffffffb3;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 0.95rem;
            color: #2c3e50;
        }
        .option.correct .letter {
            background: #2ecc71;
            color: white;
        }
        .option.wrong .letter {
            background: #e74c3c;
            color: white;
        }

        .explanation {
            margin-top: 14px;
            padding: 18px 22px;
            border-radius: 18px;
            background: #f2f6fc;
            border-left: 6px solid #4a6fa5;
            color: #1e2b3c;
            font-size: 1rem;
            line-height: 1.6;
            display: none;
            box-shadow: inset 0 1px 4px rgba(0,0,0,0.02);
        }
        .explanation.show {
            display: block;
        }
        .explanation strong {
            color: #1a3e6f;
        }
        .explanation .correct-answer {
            background: #d4efdf;
            padding: 3px 10px;
            border-radius: 30px;
            font-weight: 700;
            color: #0e4f2a;
            display: inline-block;
            margin: 4px 0;
        }
        .explanation .wrong-note {
            color: #922b21;
            font-weight: 500;
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #5d6f7f;
            font-size: 0.95rem;
            border-top: 1px solid #cbd5e1;
            padding-top: 24px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🧮 Định thức ma trận <span>20 câu</span></h1>
    <div class="subhead">5 lý thuyết · 5 dễ · 5 trung bình · 5 khó</div>

    <div class="score-panel">
        <div>✅ Đúng: <span class="score" id="scoreDisplay">0</span> / 20</div>
        <button class="reset-btn" id="resetBtn">⟲ Làm lại đề</button>
    </div>

    <div id="quizContainer"></div>

    <div class="footer">Chọn đáp án — màu xanh là đúng, màu đỏ là sai. Giải thích hiện ngay sau khi chọn.</div>
</div>

<script>
    // ======================== NGÂN HÀNG CÂU HỎI ========================
    const questions = [
        // ---------- 5 CÂU LÝ THUYẾT ----------
        {
            type: 'theory',
            text: 'Định thức của ma trận vuông cấp n có tính chất nào sau đây?',
            options: [
                'Nếu đổi chỗ hai dòng thì định thức không đổi',
                'Nếu nhân một dòng với số k thì định thức nhân với k',
                'Nếu một dòng là tổ hợp tuyến tính của các dòng khác thì định thức bằng 1',
                'Định thức của ma trận chuyển vị bằng âm định thức ma trận gốc'
            ],
            correct: 1,
            explanation: 'Tính chất: Nhân một dòng (hoặc cột) với số k thì định thức nhân với k. <br>❌ A sai vì đổi dòng định thức đổi dấu. <br>❌ C sai: nếu có dòng phụ thuộc tuyến tính thì định thức = 0. <br>❌ D sai: det(Aᵀ) = det(A).'
        },
        {
            type: 'theory',
            text: 'Cho ma trận vuông A cấp 3. Phát biểu nào ĐÚNG về mối liên hệ giữa định thức và khả nghịch?',
            options: [
                'A khả nghịch khi và chỉ khi det(A) ≠ 0',
                'A khả nghịch khi det(A) = 0',
                'det(A) = 1 thì A khả nghịch, ngược lại thì không',
                'Mọi ma trận vuông đều khả nghịch'
            ],
            correct: 0,
            explanation: 'Điều kiện cần và đủ để ma trận vuông khả nghịch là định thức khác 0. <br>❌ B sai vì det = 0 ⇒ không khả nghịch. <br>❌ C sai vì det ≠ 0 bất kỳ đều khả nghịch. <br>❌ D sai vì ma trận suy biến (det = 0) không khả nghịch.'
        },
        {
            type: 'theory',
            text: 'Định thức của ma trận tam giác (trên hoặc dưới) bằng:',
            options: [
                'Tổng các phần tử trên đường chéo chính',
                'Tích các phần tử trên đường chéo chính',
                'Hiệu của phần tử lớn nhất và nhỏ nhất trên đường chéo',
                'Luôn bằng 1'
            ],
            correct: 1,
            explanation: 'Với ma trận tam giác, định thức bằng tích các phần tử nằm trên đường chéo chính. <br>❌ A, C, D không đúng với định nghĩa.'
        },
        {
            type: 'theory',
            text: 'Khi nhân ma trận A (cấp n) với một số thực k, định thức của ma trận kA được tính như thế nào?',
            options: [
                'det(kA) = k·det(A)',
                'det(kA) = kⁿ·det(A)',
                'det(kA) = kⁿ⁻¹·det(A)',
                'det(kA) = det(A)'
            ],
            correct: 1,
            explanation: 'Vì mỗi dòng được nhân với k, thực hiện n lần ⇒ det(kA) = kⁿ det(A). <br>❌ A chỉ đúng khi n = 1. <br>❌ C sai công thức. <br>❌ D sai.'
        },
        {
            type: 'theory',
            text: 'Nếu ma trận vuông A có hai dòng giống hệt nhau thì định thức của A bằng:',
            options: [
                '0',
                '1',
                'Phụ thuộc vào các phần tử còn lại',
                'Không xác định'
            ],
            correct: 0,
            explanation: 'Theo tính chất: nếu có hai dòng (hoặc cột) giống nhau thì định thức bằng 0. <br>❌ B, C, D không đúng.'
        },

        // ---------- 5 CÂU BÀI TẬP DỄ ----------
        {
            type: 'easy',
            text: 'Tính định thức của ma trận A = [[2, 1], [3, 4]].',
            options: ['5', '8', '11', '−5'],
            correct: 0,
            explanation: 'det(A) = 2·4 − 1·3 = 8 − 3 = 5. <br>❌ B: 8 là tích 2·4. <br>❌ C: 11 là tổng 8+3. <br>❌ D: −5 là đổi dấu sai.'
        },
        {
            type: 'easy',
            text: 'Cho ma trận B = [[1, 0, 0], [0, 5, 0], [0, 0, −2]]. Định thức của B bằng:',
            options: ['−10', '10', '0', '5'],
            correct: 0,
            explanation: 'Ma trận chéo ⇒ định thức = 1·5·(−2) = −10. <br>❌ B: 10 (quên dấu âm). <br>❌ C: 0 sai. <br>❌ D: 5 chỉ là một phần tử.'
        },
        {
            type: 'easy',
            text: 'Tính định thức của ma trận C = [[3, 0], [0, 7]].',
            options: ['21', '10', '0', '−21'],
            correct: 0,
            explanation: 'Ma trận chéo cấp 2: det = 3·7 = 21. <br>❌ B: 10 là tổng. <br>❌ C: 0 sai. <br>❌ D: −21 sai dấu.'
        },
        {
            type: 'easy',
            text: 'Định thức của ma trận D = [[1, 2], [2, 4]] là:',
            options: ['0', '2', '−4', '8'],
            correct: 0,
            explanation: 'det(D) = 1·4 − 2·2 = 4 − 4 = 0. (Hai dòng tỉ lệ) <br>❌ B, C, D đều sai.'
        },
        {
            type: 'easy',
            text: 'Nếu ma trận A cấp 3 có det(A) = 6, thì det(2A) bằng bao nhiêu?',
            options: ['48', '12', '24', '6'],
            correct: 0,
            explanation: 'det(2A) = 2³·det(A) = 8·6 = 48. <br>❌ B: 12 = 2·6 (quên lũy thừa). <br>❌ C: 24 = 4·6 (nhầm 2²). <br>❌ D: 6 giữ nguyên.'
        },

        // ---------- 5 CÂU BÀI TẬP TRUNG BÌNH ----------
        {
            type: 'medium',
            text: 'Tính định thức ma trận E = [[1, 2, 3], [4, 5, 6], [7, 8, 9]].',
            options: ['0', '1', '−3', '6'],
            correct: 0,
            explanation: 'Nhận xét: dòng 3 = 2·dòng 2 − dòng 1 ⇒ phụ thuộc tuyến tính ⇒ det = 0. <br>❌ B, C, D sai.'
        },
        {
            type: 'medium',
            text: 'Cho ma trận F = [[2, 1, 0], [1, 3, 1], [0, 1, 2]]. Định thức của F là:',
            options: ['8', '10', '12', '6'],
            correct: 0,
            explanation: 'Khai triển theo dòng 1: 2·(3·2 − 1·1) − 1·(1·2 − 1·0) + 0 = 2·5 − 1·2 = 10 − 2 = 8. <br>❌ B: 10 (quên trừ 2). <br>❌ C: 12. <br>❌ D: 6.'
        },
        {
            type: 'medium',
            text: 'Biết det(A) = 4 với A là ma trận vuông cấp 3. Tính det(3A⁻¹).',
            options: ['27/4', '3/4', '12', '4/27'],
            correct: 0,
            explanation: 'det(3A⁻¹) = 3³·det(A⁻¹) = 27·(1/4) = 27/4. <br>❌ B: 3/4 (quên lũy thừa). <br>❌ C: 12 = 3·4. <br>❌ D: 4/27 (nghịch đảo sai).'
        },
        {
            type: 'medium',
            text: 'Cho ma trận G = [[1, 2, 3], [0, 1, 4], [5, 6, 0]]. Định thức của G là:',
            options: ['1', '−1', '0', '5'],
            correct: 0,
            explanation: 'det = 1·(1·0 − 4·6) − 2·(0·0 − 4·5) + 3·(0·6 − 1·5) = 1·(−24) −2·(−20) + 3·(−5) = −24 + 40 − 15 = 1. <br>❌ B: −1 (sai dấu). <br>❌ C: 0. <br>❌ D: 5.'
        },
        {
            type: 'medium',
            text: 'Nếu det(A) = 2, det(B) = 3 với A, B cùng cấp 3. Tính det(AB).',
            options: ['6', '5', '1', '8'],
            correct: 0,
            explanation: 'det(AB) = det(A)·det(B) = 2·3 = 6. <br>❌ B: 5 là tổng. <br>❌ C: 1. <br>❌ D: 8.'
        },

        // ---------- 5 CÂU BÀI TẬP KHÓ ----------
        {
            type: 'hard',
            text: 'Cho ma trận H = [[2, −1, 0, 0], [−1, 2, −1, 0], [0, −1, 2, −1], [0, 0, −1, 2]]. Định thức của H là:',
            options: ['5', '4', '3', '6'],
            correct: 0,
            explanation: 'Đây là ma trận ba đường chéo, det = 5 (có thể tính truy hồi Dₙ = 2Dₙ₋₁ − Dₙ₋₂, D₁=2, D₂=3 ⇒ D₃=4, D₄=5). <br>❌ B: 4 (nhầm D₃). <br>❌ C: 3. <br>❌ D: 6.'
        },
        {
            type: 'hard',
            text: 'Cho A là ma trận vuông cấp 4, det(A) = 2. Gọi B là ma trận nhận được từ A bằng cách đổi chỗ dòng 1 và dòng 3, sau đó nhân dòng 2 với 3. Tính det(B).',
            options: ['−6', '6', '−2', '18'],
            correct: 0,
            explanation: 'Đổi chỗ 2 dòng ⇒ det đổi dấu: −2. Nhân dòng 2 với 3 ⇒ det nhân thêm 3: (−2)·3 = −6. <br>❌ B: 6 (quên đổi dấu). <br>❌ C: −2 (quên nhân 3). <br>❌ D: 18.'
        },
        {
            type: 'hard',
            text: 'Tìm tất cả giá trị của m để định thức ma trận K = [[m, 1, 0], [1, m, 1], [0, 1, m]] bằng 0.',
            options: ['m = 0 hoặc m = ±√2', 'm = 1 hoặc m = −1', 'm = 0', 'm = 2'],
            correct: 0,
            explanation: 'det(K) = m(m² − 1) − 1(m − 0) = m³ − m − m = m³ − 2m = m(m² − 2). PT = 0 ⇔ m = 0 hoặc m = ±√2. <br>❌ B, C, D thiếu nghiệm.'
        },
        {
            type: 'hard',
            text: 'Cho ma trận vuông cấp 3: A = [[1, 2, 3], [2, 3, 4], [3, 4, m]]. Biết det(A) = 0, giá trị của m là:',
            options: ['5', '4', '6', '3'],
            correct: 0,
            explanation: 'det(A) = 1(3m − 16) − 2(2m − 12) + 3(8 − 9) = (3m − 16) − (4m − 24) − 3 = −m + 5. det = 0 ⇒ m = 5. <br>❌ B, C, D sai.'
        },
        {
            type: 'hard',
            text: 'Cho ma trận M = [[1, 1, 1], [1, 2, 3], [1, 4, 9]]. Định thức của M là:',
            options: ['2', '1', '0', '−2'],
            correct: 0,
            explanation: 'Đây là ma trận Vandermonde với các giá trị 1, 2, 3. det = (2−1)(3−1)(3−2) = 1·2·1 = 2. <br>❌ B, C, D sai.'
        }
    ];

    // ======================== KHỞI TẠO ========================
    let answeredCount = 0;
    let correctCount = 0;
    const totalQuestions = questions.length;

    const quizContainer = document.getElementById('quizContainer');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const resetBtn = document.getElementById('resetBtn');

    // Lưu trữ trạng thái đã trả lời của từng câu (để tránh chọn lại)
    let questionStates = new Array(totalQuestions).fill(false);

    // ======================== HÀM HIỂN THỊ ========================
    function renderQuiz() {
        quizContainer.innerHTML = '';
        answeredCount = 0;
        correctCount = 0;
        questionStates = new Array(totalQuestions).fill(false);
        updateScore();

        questions.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `question-${index}`;

            // Header: số thứ tự + badge
            const header = document.createElement('div');
            header.className = 'q-header';

            const qNum = document.createElement('div');
            qNum.className = 'q-num';
            qNum.textContent = index + 1;

            const qText = document.createElement('div');
            qText.className = 'q-text';
            qText.textContent = q.text;

            const badge = document.createElement('span');
            badge.className = `badge ${q.type}`;
            if (q.type === 'theory') badge.textContent = 'Lý thuyết';
            else if (q.type === 'easy') badge.textContent = 'Dễ';
            else if (q.type === 'medium') badge.textContent = 'Trung bình';
            else badge.textContent = 'Khó';

            header.appendChild(qNum);
            header.appendChild(qText);
            header.appendChild(badge);

            // Options
            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'options';

            const letters = ['A', 'B', 'C', 'D'];

            q.options.forEach((opt, optIndex) => {
                const optDiv = document.createElement('div');
                optDiv.className = 'option';
                optDiv.dataset.questionIndex = index;
                optDiv.dataset.optionIndex = optIndex;

                const letterSpan = document.createElement('span');
                letterSpan.className = 'letter';
                letterSpan.textContent = letters[optIndex];

                const textSpan = document.createElement('span');
                textSpan.textContent = opt;

                optDiv.appendChild(letterSpan);
                optDiv.appendChild(textSpan);

                optDiv.addEventListener('click', () => handleOptionClick(index, optIndex, optDiv, q, card, optionsDiv));

                optionsDiv.appendChild(optDiv);
            });

            // Explanation box
            const expBox = document.createElement('div');
            expBox.className = 'explanation';
            expBox.id = `exp-${index}`;

            card.appendChild(header);
            card.appendChild(optionsDiv);
            card.appendChild(expBox);
            quizContainer.appendChild(card);
        });
    }

    // ======================== XỬ LÝ CLICK ========================
    function handleOptionClick(qIndex, optIndex, optDiv, q, card, optionsDiv) {
        // Nếu câu đã trả lời thì bỏ qua
        if (questionStates[qIndex]) return;

        // Đánh dấu đã trả lời
        questionStates[qIndex] = true;
        answeredCount++;

        const isCorrect = (optIndex === q.correct);

        // Cập nhật điểm
        if (isCorrect) {
            correctCount++;
        }
        updateScore();

        // Làm nổi bật đáp án đúng (luôn hiển thị màu xanh cho đáp án đúng)
        const allOptions = optionsDiv.querySelectorAll('.option');
        allOptions.forEach((opt, idx) => {
            if (idx === q.correct) {
                opt.classList.add('correct');
            }
            // Nếu người dùng chọn sai, đánh dấu đỏ lựa chọn sai
            if (idx === optIndex && !isCorrect) {
                opt.classList.add('wrong');
            }
            // Khóa tất cả các lựa chọn
            opt.classList.add('locked');
        });

        // Thêm class cho card để có viền màu tương ứng
        if (isCorrect) {
            card.classList.add('correct-highlight');
        } else {
            card.classList.add('wrong-highlight');
        }

        // Hiển thị giải thích
        const expBox = document.getElementById(`exp-${qIndex}`);
        const correctLetter = ['A', 'B', 'C', 'D'][q.correct];
        const correctText = q.options[q.correct];

        let expContent = `<strong>📘 Giải thích:</strong> ${q.explanation}`;
        expContent += `<br><br><span class="correct-answer">✅ Đáp án đúng: ${correctLetter}. ${correctText}</span>`;

        if (!isCorrect) {
            const chosenLetter = ['A', 'B', 'C', 'D'][optIndex];
            const chosenText = q.options[optIndex];
            expContent += `<br><span class="wrong-note">❌ Bạn chọn: ${chosenLetter}. ${chosenText} — Sai.</span>`;
        } else {
            expContent += `<br><span style="color:#1e6f3f;">🎉 Chính xác!</span>`;
        }

        expBox.innerHTML = expContent;
        expBox.classList.add('show');
    }

    // ======================== CẬP NHẬT ĐIỂM ========================
    function updateScore() {
        scoreDisplay.textContent = `${correctCount} / ${totalQuestions}`;
    }

    // ======================== RESET ========================
    function resetQuiz() {
        renderQuiz();
    }

    // ======================== KHỞI TẠO BAN ĐẦU ========================
    renderQuiz();

    resetBtn.addEventListener('click', resetQuiz);

</script>
</body>
</html>
